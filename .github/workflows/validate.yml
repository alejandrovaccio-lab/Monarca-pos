name: Validate Monarca POS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: monarca_pos
          POSTGRES_USER: monarca
          POSTGRES_PASSWORD: monarca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monarca -d monarca_pos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://monarca:monarca@localhost:5432/monarca_pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit
      - run: npx prisma migrate status
