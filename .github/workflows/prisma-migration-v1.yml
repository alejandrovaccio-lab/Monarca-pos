name: Create Prisma Migration v1.0.0

on:
  workflow_dispatch:

jobs:
  create-migration:
    name: Generate initial database migration
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DATABASE_URL: postgresql://monarca:monarca@localhost:5432/monarca_pos

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: monarca_pos
          POSTGRES_USER: monarca
          POSTGRES_PASSWORD: monarca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monarca -d monarca_pos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Prisma generate
        run: npx prisma generate
      - name: Apply migration
        run: npx prisma migrate deploy
      - name: Verify database
        run: npx prisma migrate status
