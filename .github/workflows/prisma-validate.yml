name: Prisma Schema Validation

on:
  push:
    branches: ["main"]
    paths:
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/prisma-validate.yml"
  pull_request:
    paths:
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/prisma-validate.yml"
  workflow_dispatch:

jobs:
  validate:
    name: Validate Prisma schema
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DATABASE_URL: postgresql://monarca:monarca@localhost:5432/monarca_pos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Format Prisma schema
        run: npx prisma format

      - name: Commit Prisma formatting
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- prisma/schema.prisma; then
            echo "Schema already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "style: format Prisma schema"
          git push

      - name: Prisma validate
        run: npx prisma validate
